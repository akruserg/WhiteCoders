[project]
name = "arm-voip"
version = "1.0.0"
description = "Сервис управления звонками (Asterisk) для ARM-112"
authors = [
    {name = "Vladimir Goncharuk",email = "romanngurev07@gmail.com"}
]
requires-python = ">=3.14,<4"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
    "websockets (>=16.1.1,<17.0.0)",
]

[tool.poetry]
packages = [{include = "arm_voip", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0"
pytest-asyncio = ">=1.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"