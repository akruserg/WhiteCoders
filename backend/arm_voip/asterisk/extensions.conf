[general]
static=yes
writeprotect=no
clearglobalvars=no

; Звонки обучающимся создает сервис arm_voip через ARI (приложение Stasis),
; диалплан нужен только для проверки линии с самого софтфона.
[arm112]
; 600 - проверка микрофона и гарнитуры: собеседник слышит эхо
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; 601 - проверка динамиков: воспроизводится тестовая запись
exten => 601,1,Answer()
 same => n,Playback(demo-congrats)
 same => n,Hangup()

exten => i,1,Hangup()
exten => h,1,NoOp(call finished)
