[global]
type=global
user_agent=ARM112-Asterisk

; IP-телефоны и софтфоны по UDP
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; браузерный софтфон (WebRTC): сигнализация идет через встроенный HTTP-сервер
; Asterisk (см. http.conf), адрес - ws://<хост>:8088/ws
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

; Номера операторов создает и обновляет сервис arm_voip
; (по одному номеру на одновременный звонок)
#tryinclude "/etc/asterisk/generated/pjsip_operators.conf"
