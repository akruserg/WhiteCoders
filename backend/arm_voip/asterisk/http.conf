[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088

; Для HTTPS/WSS (браузеры разрешают микрофон только на защищенных страницах):
; положите сертификат в /etc/asterisk/keys и раскомментируйте
;tlsenable=yes
;tlsbindaddr=0.0.0.0:8089
;tlscertfile=/etc/asterisk/keys/asterisk.pem
;tlsprivatekey=/etc/asterisk/keys/asterisk.key
