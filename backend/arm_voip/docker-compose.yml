services:
  arm_voip:
    build: .
    container_name: arm_voip
    env_file:
      - .env
    environment:
      GENERATED_DIR: /generated
      AUDIO_DIR: /audio
      RECORDING_DIR: /recordings
      VOICE_BASE_URL: http://voice:8090
    volumes:
      - asterisk_generated:/generated
      - voip_audio:/audio
      - voip_recordings:/recordings:ro
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      - asterisk
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  asterisk:
    image: andrius/asterisk:latest
    container_name: arm_asterisk
    env_file:
      - .env
    entrypoint: ["sh", "/entrypoint/docker-entrypoint.sh"]
    volumes:
      - ./asterisk/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./asterisk/http.conf:/etc/asterisk/http.conf:ro
      - ./asterisk/rtp.conf:/etc/asterisk/rtp.conf:ro
      - ./asterisk/ari.conf.template:/etc/asterisk/ari.conf.template:ro
      - ./asterisk/manager.conf:/etc/asterisk/manager.conf:ro
      - ./asterisk/docker-entrypoint.sh:/entrypoint/docker-entrypoint.sh:ro
      - asterisk_generated:/etc/asterisk/generated:ro
      - voip_audio:/var/lib/asterisk/sounds/arm112:ro
      - voip_recordings:/var/spool/asterisk/recording
    ports:
      - "5060:5060/udp"
      - "10000-10100:10000-10100/udp"
      - "8088:8088"
    restart: unless-stopped

volumes:
  asterisk_generated:
  voip_audio:
  voip_recordings:
