services:
  arm_voip:
    build: .
    container_name: arm_voip
    env_file:
      - .env
    ports:
      - "8001:8001"
    depends_on:
      - asterisk
    restart: unless-stopped

  asterisk:
    image: andrius/asterisk:latest
    container_name: arm_asterisk
    env_file:
      - .env
    volumes:
      - ./asterisk/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./asterisk/http.conf:/etc/asterisk/http.conf:ro
      - ./asterisk/ari.conf.template:/etc/asterisk/ari.conf.template:ro
      - ./asterisk/manager.conf:/etc/asterisk/manager.conf:ro
      - ./asterisk/docker-entrypoint.sh:/entrypoint/docker-entrypoint.sh:ro
    ports:
      - "5060:5060/udp"
      - "10000-10100:10000-10100/udp"
      - "8088:8088"
    restart: unless-stopped