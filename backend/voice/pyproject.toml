[project]
name = "arm-voice"
version = "1.0.0"
description = "Голосовой модуль ARM-112: синтез речи заявителя (TTS) и распознавание речи оператора (STT), полностью офлайн"
authors = [
    {name = "Vladimir Goncharuk",email = "romanngurev07@gmail.com"}
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
    "python-multipart (>=0.0.20,<0.1.0)",
    "piper-tts (>=1.8.0,<2.0.0)",
    "faster-whisper (>=1.2.1,<2.0.0)",
]

[tool.poetry]
packages = [{include = "voice", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0"
httpx = ">=0.28.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
