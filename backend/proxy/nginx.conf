# Единая точка входа: HTTPS для интерфейса, API и WebSocket софтфона (wss).

server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Имена контейнеров разрешаем при запросе, а не при старте: прокси поднимается
    # даже если Asterisk или API еще не запущены.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://arm_api:5000;
    set $ws_upstream  http://asterisk:8088;

    client_max_body_size 64m;   # загрузка материалов (MAX_UPLOAD_MB в arm_api)

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # REST API
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # генерация сценариев ИИ занимает минуты
    }

    location = /health {
        proxy_pass $api_upstream;
    }

    # SIP по WebSocket для браузерного софтфона: wss://<хост>/ws
    location /ws {
        proxy_pass $ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Собранный фронтенд (frontend/dist)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
